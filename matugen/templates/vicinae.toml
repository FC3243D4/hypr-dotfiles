[meta]
version = 1
name = "Matugen"
description = "Breeze Dark-style theme driven by matugen"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "{{colors.surface_container_low.default.hex}}"
secondary_background = "{{colors.surface_container.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"
accent = "{{colors.primary.default.hex}}"

[colors.input]
border_focus = "colors.core.accent"

[colors.accents]
blue = "{{colors.primary.default.hex}}"
cyan = "{{colors.secondary.default.hex}}"
purple = "{{colors.tertiary.default.hex}}"
green = "{{colors.primary_fixed_dim.default.hex}}"
yellow = "{{colors.secondary_fixed_dim.default.hex}}"
orange = "{{colors.tertiary_fixed_dim.default.hex}}"
magenta = "{{colors.tertiary_container.default.hex}}"
red = "{{colors.secondary_container.default.hex}}"
